name: C# HTTP stalled-client resilience
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build C# HTTP server
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj -c Release
      - name: Verify stalled HTTP request cannot starve a healthy client
        run: python tests/test_http_stall.py dotnet ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
