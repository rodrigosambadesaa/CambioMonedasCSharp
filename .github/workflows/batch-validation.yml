name: C# strict batch CSV contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build .NET CLI
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj -c Release
      - name: Check CSV validation for C# port
        run: python tests/test_batch_validation.py dotnet ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
