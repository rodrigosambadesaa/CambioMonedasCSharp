name: C# exports preserve operational files
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile CLI
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj -c Release
      - name: Verify protected operational files and aliases
        run: python tests/test_protected_exports.py dotnet ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
