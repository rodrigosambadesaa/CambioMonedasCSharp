name: C reference parity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  differential-with-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout port
        uses: actions/checkout@v5
      - name: Checkout pinned original C
        uses: actions/checkout@v5
        with:
          repository: rodrigosambadesaa/CambioMonedas
          ref: 7cb355933a8f24f19a284aa85f7c21575b0db61a
          path: .ci/reference-c
      - name: Build C reference independently
        working-directory: .ci/reference-c
        run: make release
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build C# port
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj --configuration Release
      - name: Compare batch outputs and exit semantics
        run: python3 tests/compare_c_reference.py .ci/reference-c . csharp
