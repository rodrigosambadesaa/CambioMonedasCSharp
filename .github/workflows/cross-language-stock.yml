name: C# / C++ shared inventory interoperability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cross-language-stock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout C# code
        uses: actions/checkout@v5
      - name: Checkout pinned independent C++ code
        uses: actions/checkout@v5
        with:
          repository: rodrigosambadesaa/CambioMonedasCpp
          ref: f028c887696e0113bc02909ddc8a6437cb3c5886
          path: .ci/cpp
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile C++ on Linux/macOS
        if: runner.os != 'Windows'
        run: make -C .ci/cpp release
      - name: Compile C++ on Windows
        if: runner.os == 'Windows'
        working-directory: .ci/cpp
        shell: pwsh
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic main.cpp portable_cli.cpp moneda_gestion.cpp bigint.cpp vector_dinamico.cpp algoritmo_cambio.cpp -o progvoraz.exe -lws2_32
      - name: Compile C#
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj --configuration Release
      - name: Exercise actual flock protocol on Linux/macOS
        if: runner.os != 'Windows'
        run: python3 tests/test_shared_stock_interop.py .ci/cpp/progvoraz ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
      - name: Exercise actual exclusive-share protocol on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/test_shared_stock_interop.py .ci/cpp/progvoraz.exe ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
