name: C# / C++ shared inventory interoperability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cross-language-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout native C# implementation
        uses: actions/checkout@v5
      - name: Checkout pinned independent C++ implementation
        uses: actions/checkout@v5
        with:
          repository: rodrigosambadesaa/CambioMonedasCpp
          ref: 78ac82597f2dcb27bb1d443851b1f38cd67560fd
          path: .ci/cpp
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile native C++20 implementation
        run: make -C .ci/cpp release
      - name: Compile C# implementation
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj --configuration Release
      - name: Test simultaneous native flock + Win-agnostic inventory semantics on Linux
        run: |
          python3 tests/test_shared_stock_interop.py \
            .ci/cpp/progvoraz \
            ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
