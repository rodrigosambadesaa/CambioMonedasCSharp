name: Native selected-currency monetary integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-exchange:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build native console (Linux/macOS)
        if: runner.os != 'Windows'
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj --configuration Release
      - name: Build native console (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet build ProgVorazCs.Console/ProgVorazCs.Console.csproj --configuration Release
      - name: Test real persisted inventory (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 tests/test_selected_currency_transactions.py dotnet ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
      - name: Test real persisted inventory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/test_selected_currency_transactions.py dotnet ProgVorazCs.Console/bin/Release/net10.0/ProgVorazCs.Console.dll
